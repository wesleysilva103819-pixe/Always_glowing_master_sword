name: Build Android Dusk

on:
  workflow_dispatch:
  push:
    branches:
      - "*"

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28

      - name: Build
        run: cmake --build build --parallel

      - name: Upload Dusk
        uses: actions/upload-artifact@v4
        with:
          name: always-glowing-master-sword-android
          path: build/mods/*.dusk
          if-no-files-found: error
